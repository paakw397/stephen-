services:
  - type: web
    name: student-registration
    runtime: node
    plan: starter
    rootDir: Desktop/REPLIT CODES
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: student-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
